plugins {
    id "com.android.application"
}

android {
    namespace "com.xingyuan.channelsguard"
    compileSdk 37

    defaultConfig {
        applicationId "com.xingyuan.channelsguard"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "2.4"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 每次编译后自动生成带版本号的 APK 副本，如 ChannelsGuard-v2.0-debug.apk
tasks.register("copyVersionedApk", Copy) {
    def vName = android.defaultConfig.versionName
    from(layout.buildDirectory.dir("outputs/apk/debug")) {
        include("app-debug.apk")
        rename { "ChannelsGuard-v${vName}-debug.apk" }
    }
    into(rootProject.layout.projectDirectory.dir("dist"))
}
tasks.matching { it.name == "assembleDebug" }.configureEach {
    finalizedBy("copyVersionedApk")
}
